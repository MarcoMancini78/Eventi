<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eventi Langhe — Elenco</title>
<style>
  :root {
    --bg: #f3f1ea;
    --surface: #ffffff;
    --surface-2: #faf9f5;
    --border: #e2ddce;
    --border-strong: #cfc8b3;
    --text: #23211d;
    --text-2: #6b6558;
    --text-3: #948c78;
    --accent: #5c6b3f;
    --accent-dark: #46512f;
    --accent-soft: #eef1e6;
    --shadow: 0 1px 2px rgba(35, 33, 29, .04), 0 4px 16px rgba(35, 33, 29, .05);
    --shadow-card: 0 1px 3px rgba(35, 33, 29, .06), 0 1px 2px rgba(35, 33, 29, .04);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  header {
    background: linear-gradient(135deg, var(--accent-dark), var(--accent));
    color: #fff;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    z-index: 10;
  }

  .titolo-pagina {
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-width: 0;
  }

  h1 {
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: -.01em;
    margin: 0;
    white-space: nowrap;
    color: #fff;
  }

  .sottotitolo {
    font-size: 11.5px;
    color: rgba(255,255,255,.72);
    white-space: nowrap;
  }

  .header-destra {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .testo-aggiornato {
    font-size: 11px;
    color: rgba(255,255,255,.72);
    white-space: nowrap;
  }

  .link-mappa {
    font-size: 12.5px;
    font-weight: 600;
    color: #fff;
    text-decoration: none;
    white-space: nowrap;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(255,255,255,.16);
    transition: background .12s ease;
  }
  .link-mappa:hover { background: rgba(255,255,255,.28); }

  .barra-stato {
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
    padding: 6px 20px;
    font-size: 12px;
    color: var(--text-3);
  }

  .filtri {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: flex-end;
    gap: 14px;
    flex-wrap: wrap;
    box-shadow: var(--shadow);
    position: relative;
    z-index: 5;
  }

  .campo-filtro {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1 1 140px;
  }

  .campo-filtro label {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--text-3);
  }

  .campo-filtro input,
  .campo-filtro select {
    font-size: 14px;
    padding: 8px 10px;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
    width: 100%;
    outline-offset: 1px;
    -webkit-appearance: none;
    appearance: none;
  }
  .campo-filtro input:focus,
  .campo-filtro select:focus {
    border-color: var(--accent);
    outline: 2px solid var(--accent-soft);
  }

  button#btn-reset {
    font-size: 13px;
    font-weight: 600;
    padding: 8px 16px;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text-2);
    cursor: pointer;
    height: 38px;
    flex: 0 0 auto;
  }
  button#btn-reset:hover { border-color: var(--accent); color: var(--accent); }

  main {
    flex: 1;
    overflow: auto;
    padding: 16px 20px 28px;
  }

  /* --- Tabella (desktop) --- */
  .tabella-scroll {
    background: var(--surface);
    border-radius: 12px;
    box-shadow: var(--shadow);
    overflow: hidden;
    border: 1px solid var(--border);
  }

  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 13.5px;
  }

  thead th {
    position: sticky;
    top: 0;
    background: var(--surface-2);
    text-align: left;
    padding: 11px 14px;
    border-bottom: 1px solid var(--border-strong);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
    font-weight: 700;
    color: var(--text-2);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  thead th:hover { color: var(--accent); }
  thead th.col-numero { cursor: default; text-align: right; }
  thead th.col-numero:hover { color: var(--text-2); }

  .icona-ordinamento {
    display: inline-block;
    margin-left: 4px;
    font-size: 10px;
    color: var(--accent);
  }

  tbody td {
    padding: 11px 14px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr { transition: background .1s ease; }
  tbody tr:hover { background: var(--accent-soft); }

  .col-titolo { min-width: 240px; font-weight: 600; }
  .col-descrizione { min-width: 280px; color: var(--text-2); font-weight: 400; }
  .col-numero { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-2); white-space: nowrap; }

  .badge-tipo {
    display: inline-block;
    font-size: 11.5px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    white-space: nowrap;
  }

  .badge-quarantena {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    color: #92400e;
    background: #fef3c7;
    border-radius: 999px;
    padding: 2px 8px;
    margin-right: 6px;
  }
  a.link-fonte {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
  }
  a.link-fonte:hover { text-decoration: underline; }

  .nessun-risultato {
    padding: 48px 20px;
    text-align: center;
    color: var(--text-3);
    font-size: 14px;
  }

  /* --- Card (mobile) --- */
  .elenco-card {
    display: none;
  }

  .scheda-evento {
    background: var(--surface);
    border-radius: 12px;
    box-shadow: var(--shadow-card);
    border: 1px solid var(--border);
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .scheda-evento .riga-alto {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 6px;
  }
  .scheda-evento .titolo-evento {
    font-weight: 700;
    font-size: 14.5px;
    line-height: 1.3;
  }
  .scheda-evento .km-evento {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    white-space: nowrap;
    padding-top: 2px;
  }
  .scheda-evento .riga-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: var(--text-2);
    margin-bottom: 8px;
  }
  .scheda-evento .riga-meta .puntino {
    color: var(--text-3);
  }
  .scheda-evento .descrizione-evento {
    font-size: 13px;
    color: var(--text-2);
    line-height: 1.4;
    margin-bottom: 8px;
  }
  .scheda-evento .riga-basso {
    display: flex;
    justify-content: flex-end;
  }

  @media (max-width: 760px) {
    header { padding: 10px 14px; }
    .filtri, main, .barra-stato { padding-left: 14px; padding-right: 14px; }
    .filtri { gap: 10px; }
    .campo-filtro { flex: 1 1 45%; }
    button#btn-reset { flex: 1 1 100%; }

    .tabella-scroll { display: none; }
    .elenco-card { display: block; }
  }
</style>
</head>
<body>

<header>
  <div class="titolo-pagina">
    <h1>Eventi Langhe</h1>
    <span class="sottotitolo">Elenco eventi</span>
  </div>
  <div class="header-destra">
    <span id="aggiornato" class="testo-aggiornato"></span>
    <a href="index.html" class="link-mappa">← Mappa</a>
  </div>
</header>

<div class="barra-stato">
  <span id="stato">Caricamento…</span>
</div>

<div class="filtri">
  <div class="campo-filtro">
    <label for="filtro-data">Data</label>
    <input type="date" id="filtro-data">
  </div>
  <div class="campo-filtro">
    <label for="filtro-comune">Comune</label>
    <select id="filtro-comune">
      <option value="">Tutti</option>
    </select>
  </div>
  <div class="campo-filtro">
    <label for="filtro-tipologia">Tipo evento</label>
    <select id="filtro-tipologia">
      <option value="">Tutti</option>
    </select>
  </div>
  <button type="button" id="btn-reset">Azzera filtri</button>
</div>

<main>
  <div class="tabella-scroll">
    <table id="tabella-eventi">
      <thead>
        <tr>
          <th data-colonna="titolo">Titolo<span class="icona-ordinamento"></span></th>
          <th data-colonna="tipologia">Tipo<span class="icona-ordinamento"></span></th>
          <th data-colonna="comune">Comune<span class="icona-ordinamento"></span></th>
          <th data-colonna="data_inizio">Dal<span class="icona-ordinamento"></span></th>
          <th data-colonna="data_fine">Al<span class="icona-ordinamento"></span></th>
          <th data-colonna="km" class="col-numero">Km<span class="icona-ordinamento"></span></th>
          <th class="col-descrizione">Descrizione</th>
          <th>Fonte</th>
        </tr>
      </thead>
      <tbody id="corpo-tabella"></tbody>
    </table>
  </div>

  <div class="elenco-card" id="elenco-card"></div>
</main>

<script>
const URL_DATI_REMOTI = "eventi_mappa.json";

let eventiTotali = [];
let colonnaOrdinamento = "km";
let direzioneOrdinamento = 1;

const NOMI_MESI = ["gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno",
  "luglio", "agosto", "settembre", "ottobre", "novembre", "dicembre"];

function formattaDataOraItaliana(isoDataOra) {
  if (!isoDataOra) return "?";
  const [parteData, parteOra] = isoDataOra.split("T");
  if (!parteData) return isoDataOra;
  const [anno, mese, giorno] = parteData.split("-");
  const testoData = `${giorno} ${NOMI_MESI[Number(mese) - 1]} ${anno}`;
  if (!parteOra) return testoData;
  const [ore, minuti] = parteOra.split(":");
  return `${testoData} alle ${ore}:${minuti}`;
}

function formattaDataItalianaBreve(iso) {
  if (!iso) return "";
  const [anno, mese, giorno] = iso.split("-");
  return `${giorno}/${mese}/${anno}`;
}

function dataOdiernaIso() {
  const oggi = new Date();
  const anno = oggi.getFullYear();
  const mese = String(oggi.getMonth() + 1).padStart(2, "0");
  const giorno = String(oggi.getDate()).padStart(2, "0");
  return `${anno}-${mese}-${giorno}`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function impostaStato(testo, errore) {
  const el = document.getElementById("stato");
  el.textContent = testo;
  el.style.color = errore ? "#a24a3d" : "";
}

async function caricaEventi() {
  try {
    const risposta = await fetch(URL_DATI_REMOTI, { cache: "no-store" });
    if (!risposta.ok) throw new Error("HTTP " + risposta.status);
    const dati = await risposta.json();
    eventiTotali = Array.isArray(dati.eventi) ? dati.eventi : [];
    popolaFiltri();
    applicaFiltri();
    document.getElementById("aggiornato").textContent = `Aggiornato il ${formattaDataOraItaliana(dati.generato_il)}`;
  } catch (e) {
    impostaStato("Caricamento non riuscito: " + e.message, true);
  }
}

function popolaFiltri() {
  const comuni = [...new Set(eventiTotali.map((ev) => ev.comune).filter(Boolean))].sort((a, b) => a.localeCompare(b, "it"));
  const tipologie = [...new Set(eventiTotali.map((ev) => ev.tipologia).filter(Boolean))].sort((a, b) => a.localeCompare(b, "it"));

  const selComune = document.getElementById("filtro-comune");
  for (const comune of comuni) {
    const opt = document.createElement("option");
    opt.value = comune;
    opt.textContent = comune;
    selComune.appendChild(opt);
  }

  const selTipologia = document.getElementById("filtro-tipologia");
  for (const tipo of tipologie) {
    const opt = document.createElement("option");
    opt.value = tipo;
    opt.textContent = tipo;
    selTipologia.appendChild(opt);
  }
}

function eventiFiltrati() {
  const data = document.getElementById("filtro-data").value;
  const comune = document.getElementById("filtro-comune").value;
  const tipologia = document.getElementById("filtro-tipologia").value;

  return eventiTotali.filter((ev) => {
    if (data) {
      const fineEvento = ev.data_fine || ev.data_inizio;
      if (!(ev.data_inizio <= data && data <= fineEvento)) return false;
    }
    if (comune && ev.comune !== comune) return false;
    if (tipologia && ev.tipologia !== tipologia) return false;
    return true;
  });
}

function ordina(eventi) {
  const col = colonnaOrdinamento;
  return [...eventi].sort((a, b) => {
    const va = a[col] ?? "";
    const vb = b[col] ?? "";
    if (va < vb) return -1 * direzioneOrdinamento;
    if (va > vb) return 1 * direzioneOrdinamento;
    return 0;
  });
}

function aggiornaIndicatoriOrdinamento() {
  document.querySelectorAll("thead th[data-colonna]").forEach((th) => {
    const icona = th.querySelector(".icona-ordinamento");
    if (th.dataset.colonna === colonnaOrdinamento) {
      icona.textContent = direzioneOrdinamento === 1 ? "▲" : "▼";
    } else {
      icona.textContent = "";
    }
  });
}

function applicaFiltri() {
  aggiornaIndicatoriOrdinamento();
  const filtrati = ordina(eventiFiltrati());
  disegnaTabella(filtrati);
  disegnaCard(filtrati);
  aggiornaConteggio(filtrati.length);
}

function disegnaTabella(filtrati) {
  const corpo = document.getElementById("corpo-tabella");
  corpo.innerHTML = "";

  if (filtrati.length === 0) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td colspan="8" class="nessun-risultato">Nessun evento corrisponde ai filtri selezionati.</td>`;
    corpo.appendChild(tr);
    return;
  }

  for (const ev of filtrati) {
    const tr = document.createElement("tr");
    const linkFonte = ev.url
      ? `<a class="link-fonte" href="${escapeHtml(ev.url)}" target="_blank" rel="noopener">apri</a>`
      : "";
    tr.innerHTML = `
      <td class="col-titolo">${ev.quarantena ? '<span class="badge-quarantena">⚠️ da verificare</span>' : ""}${escapeHtml(ev.titolo || "")}</td>
      <td><span class="badge-tipo">${escapeHtml(ev.tipologia || "")}</span></td>
      <td>${escapeHtml(ev.comune || "")}</td>
      <td>${formattaDataItalianaBreve(ev.data_inizio)}</td>
      <td>${formattaDataItalianaBreve(ev.data_fine)}</td>
      <td class="col-numero">${ev.km != null ? ev.km : ""}</td>
      <td class="col-descrizione">${escapeHtml(ev.descrizione || "")}</td>
      <td>${linkFonte}</td>
    `;
    corpo.appendChild(tr);
  }
}

function disegnaCard(filtrati) {
  const contenitore = document.getElementById("elenco-card");
  contenitore.innerHTML = "";

  if (filtrati.length === 0) {
    contenitore.innerHTML = `<div class="nessun-risultato">Nessun evento corrisponde ai filtri selezionati.</div>`;
    return;
  }

  for (const ev of filtrati) {
    const periodo = ev.data_fine && ev.data_fine !== ev.data_inizio
      ? `${formattaDataItalianaBreve(ev.data_inizio)} → ${formattaDataItalianaBreve(ev.data_fine)}`
      : formattaDataItalianaBreve(ev.data_inizio);
    const linkFonte = ev.url
      ? `<a class="link-fonte" href="${escapeHtml(ev.url)}" target="_blank" rel="noopener">apri fonte →</a>`
      : "";
    const scheda = document.createElement("div");
    scheda.className = "scheda-evento";
    scheda.innerHTML = `
      <div class="riga-alto">
        <div class="titolo-evento">${ev.quarantena ? '<span class="badge-quarantena">⚠️</span>' : ""}${escapeHtml(ev.titolo || "")}</div>
        ${ev.km != null ? `<div class="km-evento">${ev.km} km</div>` : ""}
      </div>
      <div class="riga-meta">
        <span class="badge-tipo">${escapeHtml(ev.tipologia || "")}</span>
        <span class="puntino">·</span>
        <span>${escapeHtml(ev.comune || "")}</span>
        <span class="puntino">·</span>
        <span>${escapeHtml(periodo)}</span>
      </div>
      ${ev.descrizione ? `<div class="descrizione-evento">${escapeHtml(ev.descrizione)}</div>` : ""}
      ${linkFonte ? `<div class="riga-basso">${linkFonte}</div>` : ""}
    `;
    contenitore.appendChild(scheda);
  }
}

function aggiornaConteggio(n) {
  const totale = eventiTotali.length;
  const el = document.getElementById("stato");
  if (n === totale) {
    el.textContent = `${totale} eventi.`;
  } else {
    el.textContent = `${n} eventi su ${totale} totali (filtrati).`;
  }
  el.style.color = "";
}

document.getElementById("filtro-data").addEventListener("change", applicaFiltri);
document.getElementById("filtro-comune").addEventListener("change", applicaFiltri);
document.getElementById("filtro-tipologia").addEventListener("change", applicaFiltri);

document.getElementById("btn-reset").addEventListener("click", () => {
  document.getElementById("filtro-data").value = "";
  document.getElementById("filtro-comune").value = "";
  document.getElementById("filtro-tipologia").value = "";
  applicaFiltri();
});

document.querySelectorAll("thead th[data-colonna]").forEach((th) => {
  th.addEventListener("click", () => {
    const col = th.dataset.colonna;
    if (colonnaOrdinamento === col) {
      direzioneOrdinamento *= -1;
    } else {
      colonnaOrdinamento = col;
      direzioneOrdinamento = 1;
    }
    applicaFiltri();
  });
});

document.getElementById("filtro-data").value = dataOdiernaIso();
caricaEventi();
</script>

</body>
</html>
