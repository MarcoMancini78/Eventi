<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eventi Langhe — Perimetro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2f0e9;
    --surface: #ffffff;
    --surface-2: #f8f7f2;
    --border: #e5e0d3;
    --border-strong: #d3ccb8;
    --text: #211f1a;
    --text-2: #63594a;
    --text-3: #9a917c;
    --accent: #4f6b3f;
    --accent-dark: #33482a;
    --accent-bright: #7a9a5f;
    --accent-soft: #e7edde;
    --shadow-sm: 0 1px 2px rgba(30, 27, 18, .05);
    --shadow-md: 0 4px 16px rgba(30, 27, 18, .06), 0 1px 3px rgba(30, 27, 18, .05);
    --shadow-lg: 0 12px 32px rgba(30, 27, 18, .10), 0 2px 6px rgba(30, 27, 18, .06);
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Inter", -apple-system, "Segoe UI", sans-serif;
    background:
      radial-gradient(1100px 480px at 100% -10%, #eef2e4 0%, transparent 55%),
      radial-gradient(900px 420px at -10% 0%, #f4f1e6 0%, transparent 50%),
      var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  header {
    background: linear-gradient(120deg, var(--accent-dark) 0%, var(--accent) 55%, var(--accent-bright) 130%);
    color: #fff;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 20;
    box-shadow: var(--shadow-md);
  }

  .titolo-pagina {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .logo-punto {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(255,255,255,.22);
    flex-shrink: 0;
  }

  h1 {
    font-size: 1.15rem;
    font-weight: 800;
    letter-spacing: -.02em;
    margin: 0;
    white-space: nowrap;
    color: #fff;
  }

  .sottotitolo {
    font-size: 12px;
    font-weight: 500;
    color: rgba(255,255,255,.75);
    white-space: nowrap;
    padding-left: 10px;
    margin-left: 2px;
    border-left: 1px solid rgba(255,255,255,.3);
  }

  .header-destra {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .link-nav {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent-dark);
    text-decoration: none;
    white-space: nowrap;
    padding: 8px 16px;
    border-radius: 999px;
    background: #fff;
    box-shadow: var(--shadow-sm);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .link-nav:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }

  .barra-filtri {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: flex-end;
    gap: 14px;
    flex-wrap: wrap;
    box-shadow: var(--shadow-sm);
    position: sticky;
    top: var(--altezza-header, 0px);
    z-index: 15;
  }

  .campo-filtro {
    display: flex;
    flex-direction: column;
    gap: 5px;
    flex: 1 1 220px;
  }

  .campo-filtro label {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--text-3);
  }

  .campo-filtro input,
  .campo-filtro select {
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    padding: 9px 12px;
    border: 1.5px solid var(--border-strong);
    border-radius: 10px;
    background: var(--surface-2);
    color: var(--text);
    width: 100%;
    outline-offset: 1px;
    -webkit-appearance: none;
    appearance: none;
    transition: border-color .12s ease, background .12s ease;
  }
  .campo-filtro input:hover,
  .campo-filtro select:hover { border-color: var(--text-3); }
  .campo-filtro input:focus,
  .campo-filtro select:focus {
    border-color: var(--accent);
    background: var(--surface);
    outline: 3px solid var(--accent-soft);
  }

  button#btn-reset {
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 9px 18px;
    border: 1.5px solid transparent;
    border-radius: 10px;
    background: var(--accent-soft);
    color: var(--accent-dark);
    cursor: pointer;
    height: 40px;
    flex: 0 0 auto;
    transition: background .12s ease;
  }
  button#btn-reset:hover { background: #dbe6ca; }

  .pillola-conteggio {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-2);
    white-space: nowrap;
    margin-left: auto;
    padding-bottom: 10px;
  }
  .pillola-conteggio strong {
    color: var(--accent-dark);
    font-weight: 800;
  }

  main {
    flex: 1;
    padding: 20px 24px 32px;
  }

  .tabella-scroll {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    overflow: visible;
    border: 1px solid var(--border);
  }

  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 13.5px;
  }

  thead th {
    position: sticky;
    top: var(--altezza-fissa, 0px);
    background: var(--surface-2);
    text-align: left;
    padding: 13px 14px;
    border-bottom: 1.5px solid var(--border-strong);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
    font-weight: 700;
    color: var(--text-2);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .05em;
    transition: color .12s ease;
  }
  thead th:hover { color: var(--accent); }
  thead th.col-numero { cursor: default; text-align: right; }
  thead th.col-numero:hover { color: var(--text-2); }
  thead th.col-link { cursor: default; }
  thead th.col-link:hover { color: var(--text-2); }
  thead th:first-child { border-top-left-radius: var(--radius); }
  thead th:last-child { border-top-right-radius: var(--radius); }
  tbody tr:last-child td:first-child { border-bottom-left-radius: var(--radius); }
  tbody tr:last-child td:last-child { border-bottom-right-radius: var(--radius); }

  .icona-ordinamento {
    display: inline-block;
    margin-left: 4px;
    font-size: 10px;
    color: var(--accent);
  }

  tbody td {
    padding: 11px 14px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr { transition: background .1s ease; }
  tbody tr:hover { background: var(--accent-soft); }

  .col-comune { min-width: 160px; font-weight: 600; }
  .col-numero { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--accent-dark); white-space: nowrap; }
  .col-numero-progressivo {
    text-align: right;
    color: var(--text-3);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    width: 1%;
    white-space: nowrap;
  }
  .col-link { min-width: 90px; }
  .col-altro { min-width: 180px; }

  .link-icona {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: var(--accent-soft);
    color: var(--accent-dark);
    text-decoration: none;
    font-size: 14px;
    transition: background .12s ease, transform .12s ease;
  }
  .link-icona:hover { background: var(--accent-bright); color: #fff; transform: translateY(-1px); }
  .link-assente { color: var(--text-3); font-size: 12px; }

  .chip-altro {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent-dark);
    background: var(--accent-soft);
    border-radius: 999px;
    padding: 3px 10px;
    text-decoration: none;
    margin: 2px 4px 2px 0;
    white-space: nowrap;
  }
  .chip-altro:hover { background: var(--accent-bright); color: #fff; }

  .nessun-risultato {
    padding: 56px 20px;
    text-align: center;
    color: var(--text-3);
    font-size: 14.5px;
    font-weight: 500;
  }

  /* --- Card (mobile) --- */
  .elenco-card { display: none; }

  .scheda-comune {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    border: 1px solid var(--border);
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .scheda-comune .riga-alto {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 8px;
  }
  .scheda-comune .titolo-comune {
    font-weight: 700;
    font-size: 15px;
    line-height: 1.35;
    letter-spacing: -.01em;
    flex: 1;
  }
  .scheda-comune .km-comune {
    font-size: 12px;
    font-weight: 800;
    color: #fff;
    background: var(--accent);
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .scheda-comune .riga-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-2);
    margin-bottom: 12px;
  }
  .scheda-comune .riga-meta .puntino { color: var(--text-3); }
  .scheda-comune .gruppo-link {
    margin-top: 10px;
  }
  .scheda-comune .gruppo-link .etichetta {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--text-3);
    margin-bottom: 5px;
  }
  .scheda-comune .riga-icone {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }

  @media (max-width: 760px) {
    header { padding: 12px 16px; }
    .sottotitolo { display: none; }
    .barra-filtri { padding: 12px 16px; gap: 10px; }
    main { padding: 16px 16px 28px; }
    .campo-filtro { flex: 1 1 45%; }
    button#btn-reset { flex: 1 1 100%; order: 5; }
    .pillola-conteggio { flex: 1 1 100%; margin-left: 0; justify-content: flex-start; order: 4; padding-bottom: 2px; }

    .tabella-scroll { display: none; }
    .elenco-card { display: block; }
  }
</style>
</head>
<body>

<header>
  <div class="titolo-pagina">
    <span class="logo-punto"></span>
    <h1>Eventi Langhe</h1>
    <span class="sottotitolo" id="aggiornato"></span>
  </div>
  <div class="header-destra">
    <a href="index.html" class="link-nav">← Mappa</a>
    <a href="elenco.html" class="link-nav">Elenco eventi</a>
  </div>
</header>

<div class="barra-filtri">
  <div class="campo-filtro">
    <label for="filtro-testo">Cerca comune</label>
    <input type="text" id="filtro-testo" placeholder="Nome comune...">
  </div>
  <div class="campo-filtro">
    <label for="filtro-provincia">Provincia</label>
    <select id="filtro-provincia">
      <option value="">Tutte</option>
    </select>
  </div>
  <button type="button" id="btn-reset">Azzera filtri</button>
  <span class="pillola-conteggio" id="stato">Caricamento…</span>
</div>

<main>
  <div class="tabella-scroll">
    <table id="tabella-perimetro">
      <thead>
        <tr>
          <th class="col-numero-progressivo">#</th>
          <th data-colonna="comune">Comune<span class="icona-ordinamento"></span></th>
          <th data-colonna="provincia">Prov.<span class="icona-ordinamento"></span></th>
          <th data-colonna="km" class="col-numero">Km<span class="icona-ordinamento"></span></th>
          <th data-colonna="minuti" class="col-numero">Min.<span class="icona-ordinamento"></span></th>
          <th class="col-link">Sito comune</th>
          <th class="col-link">Social comune</th>
          <th class="col-link">Sito Pro Loco</th>
          <th class="col-link">Social Pro Loco</th>
          <th class="col-altro">Altro</th>
        </tr>
      </thead>
      <tbody id="corpo-tabella"></tbody>
    </table>
  </div>

  <div class="elenco-card" id="elenco-card"></div>
</main>

<script>
const URL_DATI_REMOTI = "perimetro.json";

let comuniTotali = [];
let colonnaOrdinamento = "km";
let direzioneOrdinamento = 1;

const NOMI_MESI = ["gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno",
  "luglio", "agosto", "settembre", "ottobre", "novembre", "dicembre"];

function formattaDataOraItaliana(isoDataOra) {
  if (!isoDataOra) return "?";
  const [parteData, parteOra] = isoDataOra.split("T");
  if (!parteData) return isoDataOra;
  const [anno, mese, giorno] = parteData.split("-");
  const testoData = `${giorno} ${NOMI_MESI[Number(mese) - 1]} ${anno}`;
  if (!parteOra) return testoData;
  const [ore, minuti] = parteOra.split(":");
  return `${testoData} alle ${ore}:${minuti}`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function impostaStato(testo, errore) {
  const el = document.getElementById("stato");
  el.textContent = testo;
  el.style.color = errore ? "#a24a3d" : "";
}

async function caricaPerimetro() {
  try {
    const risposta = await fetch(URL_DATI_REMOTI, { cache: "no-store" });
    if (!risposta.ok) throw new Error("HTTP " + risposta.status);
    const dati = await risposta.json();
    comuniTotali = Array.isArray(dati.comuni) ? dati.comuni : [];
    popolaFiltri();
    applicaFiltri();
    document.getElementById("aggiornato").textContent = `Aggiornato il ${formattaDataOraItaliana(dati.generato_il)}`;
  } catch (e) {
    impostaStato("Caricamento non riuscito: " + e.message, true);
  }
}

function popolaFiltri() {
  const province = [...new Set(comuniTotali.map((c) => c.provincia).filter(Boolean))].sort((a, b) => a.localeCompare(b, "it"));
  const selProvincia = document.getElementById("filtro-provincia");
  for (const provincia of province) {
    const opt = document.createElement("option");
    opt.value = provincia;
    opt.textContent = provincia;
    selProvincia.appendChild(opt);
  }
}

function comuniFiltrati() {
  const testo = document.getElementById("filtro-testo").value.trim().toLowerCase();
  const provincia = document.getElementById("filtro-provincia").value;

  return comuniTotali.filter((c) => {
    if (testo && !c.comune.toLowerCase().includes(testo)) return false;
    if (provincia && c.provincia !== provincia) return false;
    return true;
  });
}

function ordina(comuni) {
  const col = colonnaOrdinamento;
  return [...comuni].sort((a, b) => {
    const va = a[col] ?? "";
    const vb = b[col] ?? "";
    if (va < vb) return -1 * direzioneOrdinamento;
    if (va > vb) return 1 * direzioneOrdinamento;
    return 0;
  });
}

function aggiornaIndicatoriOrdinamento() {
  document.querySelectorAll("thead th[data-colonna]").forEach((th) => {
    const icona = th.querySelector(".icona-ordinamento");
    if (th.dataset.colonna === colonnaOrdinamento) {
      icona.textContent = direzioneOrdinamento === 1 ? "▲" : "▼";
    } else {
      icona.textContent = "";
    }
  });
}

function applicaFiltri() {
  aggiornaIndicatoriOrdinamento();
  const filtrati = ordina(comuniFiltrati());
  disegnaTabella(filtrati);
  disegnaCard(filtrati);
  aggiornaConteggio(filtrati.length);
}

function linkIcona(url, etichetta, simbolo) {
  if (!url) return `<span class="link-assente">—</span>`;
  return `<a class="link-icona" href="${escapeHtml(url)}" target="_blank" rel="noopener" title="${escapeHtml(etichetta)}">${simbolo}</a>`;
}

function socialIcone(urlFacebook, urlInstagram) {
  const parti = [];
  if (urlFacebook) parti.push(linkIcona(urlFacebook, "Facebook", "f"));
  if (urlInstagram) parti.push(linkIcona(urlInstagram, "Instagram", "ig"));
  return parti.length ? parti.join(" ") : `<span class="link-assente">—</span>`;
}

function altroChips(altro) {
  if (!altro || altro.length === 0) return `<span class="link-assente">—</span>`;
  return altro
    .map((a) => {
      const link = a.facebook || a.instagram;
      return `<a class="chip-altro" href="${escapeHtml(link)}" target="_blank" rel="noopener">${escapeHtml(a.soggetto)}</a>`;
    })
    .join("");
}

function disegnaTabella(filtrati) {
  const corpo = document.getElementById("corpo-tabella");
  corpo.innerHTML = "";

  if (filtrati.length === 0) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td colspan="10" class="nessun-risultato">Nessun comune corrisponde ai filtri selezionati.</td>`;
    corpo.appendChild(tr);
    return;
  }

  filtrati.forEach((c, indice) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="col-numero-progressivo">${indice + 1}</td>
      <td class="col-comune">${escapeHtml(c.comune)}</td>
      <td>${escapeHtml(c.provincia || "")}</td>
      <td class="col-numero">${c.km != null ? c.km : ""}</td>
      <td class="col-numero">${c.minuti != null ? c.minuti : ""}</td>
      <td class="col-link">${linkIcona(c.sito_comune, "Sito del comune", "🌐")}</td>
      <td class="col-link">${socialIcone(c.facebook_comune, c.instagram_comune)}</td>
      <td class="col-link">${linkIcona(c.sito_proloco, "Sito Pro Loco", "🌐")}</td>
      <td class="col-link">${socialIcone(c.facebook_proloco, c.instagram_proloco)}</td>
      <td class="col-altro">${altroChips(c.altro)}</td>
    `;
    corpo.appendChild(tr);
  });
}

function disegnaCard(filtrati) {
  const contenitore = document.getElementById("elenco-card");
  contenitore.innerHTML = "";

  if (filtrati.length === 0) {
    contenitore.innerHTML = `<div class="nessun-risultato">Nessun comune corrisponde ai filtri selezionati.</div>`;
    return;
  }

  filtrati.forEach((c) => {
    const scheda = document.createElement("div");
    scheda.className = "scheda-comune";
    scheda.innerHTML = `
      <div class="riga-alto">
        <div class="titolo-comune">${escapeHtml(c.comune)}</div>
        ${c.km != null ? `<div class="km-comune">${c.km} km</div>` : ""}
      </div>
      <div class="riga-meta">
        <span>${escapeHtml(c.provincia || "")}</span>
        <span class="puntino">·</span>
        <span>${c.minuti != null ? c.minuti + " min" : ""}</span>
      </div>
      <div class="gruppo-link">
        <div class="etichetta">Comune</div>
        <div class="riga-icone">${linkIcona(c.sito_comune, "Sito del comune", "🌐")} ${socialIcone(c.facebook_comune, c.instagram_comune)}</div>
      </div>
      <div class="gruppo-link">
        <div class="etichetta">Pro Loco</div>
        <div class="riga-icone">${linkIcona(c.sito_proloco, "Sito Pro Loco", "🌐")} ${socialIcone(c.facebook_proloco, c.instagram_proloco)}</div>
      </div>
      ${c.altro && c.altro.length ? `<div class="gruppo-link"><div class="etichetta">Altro</div>${altroChips(c.altro)}</div>` : ""}
    `;
    contenitore.appendChild(scheda);
  });
}

function aggiornaConteggio(n) {
  const totale = comuniTotali.length;
  const el = document.getElementById("stato");
  if (n === totale) {
    el.innerHTML = `<strong>${totale}</strong> comuni`;
  } else {
    el.innerHTML = `<strong>${n}</strong> su ${totale} comuni`;
  }
  el.style.color = "";
}

document.getElementById("filtro-testo").addEventListener("input", applicaFiltri);
document.getElementById("filtro-provincia").addEventListener("change", applicaFiltri);

document.getElementById("btn-reset").addEventListener("click", () => {
  document.getElementById("filtro-testo").value = "";
  document.getElementById("filtro-provincia").value = "";
  applicaFiltri();
});

document.querySelectorAll("thead th[data-colonna]").forEach((th) => {
  th.addEventListener("click", () => {
    const col = th.dataset.colonna;
    if (colonnaOrdinamento === col) {
      direzioneOrdinamento *= -1;
    } else {
      colonnaOrdinamento = col;
      direzioneOrdinamento = 1;
    }
    applicaFiltri();
  });
});

function aggiornaAltezzaFissa() {
  const header = document.querySelector("header");
  const filtri = document.querySelector(".barra-filtri");
  document.documentElement.style.setProperty("--altezza-header", `${header.offsetHeight}px`);
  document.documentElement.style.setProperty("--altezza-fissa", `${header.offsetHeight + filtri.offsetHeight}px`);
}

window.addEventListener("resize", aggiornaAltezzaFissa);
aggiornaAltezzaFissa();

caricaPerimetro();
</script>

</body>
</html>
