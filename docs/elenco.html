<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eventi Langhe — Elenco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2f0e9;
    --surface: #ffffff;
    --surface-2: #f8f7f2;
    --border: #e5e0d3;
    --border-strong: #d3ccb8;
    --text: #211f1a;
    --text-2: #63594a;
    --text-3: #9a917c;
    --accent: #4f6b3f;
    --accent-dark: #33482a;
    --accent-bright: #7a9a5f;
    --accent-soft: #e7edde;
    --shadow-sm: 0 1px 2px rgba(30, 27, 18, .05);
    --shadow-md: 0 4px 16px rgba(30, 27, 18, .06), 0 1px 3px rgba(30, 27, 18, .05);
    --shadow-lg: 0 12px 32px rgba(30, 27, 18, .10), 0 2px 6px rgba(30, 27, 18, .06);
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Inter", -apple-system, "Segoe UI", sans-serif;
    background:
      radial-gradient(1100px 480px at 100% -10%, #eef2e4 0%, transparent 55%),
      radial-gradient(900px 420px at -10% 0%, #f4f1e6 0%, transparent 50%),
      var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  header {
    background: linear-gradient(120deg, var(--accent-dark) 0%, var(--accent) 55%, var(--accent-bright) 130%);
    color: #fff;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 20;
    box-shadow: var(--shadow-md);
  }

  .titolo-pagina {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .logo-punto {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(255,255,255,.22);
    flex-shrink: 0;
  }

  h1 {
    font-size: 1.15rem;
    font-weight: 800;
    letter-spacing: -.02em;
    margin: 0;
    white-space: nowrap;
    color: #fff;
  }

  .sottotitolo {
    font-size: 12px;
    font-weight: 500;
    color: rgba(255,255,255,.75);
    white-space: nowrap;
    padding-left: 10px;
    margin-left: 2px;
    border-left: 1px solid rgba(255,255,255,.3);
  }

  .header-destra {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .testo-aggiornato {
    font-size: 11.5px;
    font-weight: 500;
    color: rgba(255,255,255,.75);
    white-space: nowrap;
  }

  .link-mappa {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent-dark);
    text-decoration: none;
    white-space: nowrap;
    padding: 8px 16px;
    border-radius: 999px;
    background: #fff;
    box-shadow: var(--shadow-sm);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .link-mappa:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }

  .barra-filtri {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: flex-end;
    gap: 14px;
    flex-wrap: wrap;
    box-shadow: var(--shadow-sm);
    position: sticky;
    top: var(--altezza-header, 0px);
    z-index: 15;
  }

  .campo-filtro {
    display: flex;
    flex-direction: column;
    gap: 5px;
    flex: 1 1 150px;
  }

  .campo-filtro label {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--text-3);
  }

  .campo-filtro input,
  .campo-filtro select {
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    padding: 9px 12px;
    border: 1.5px solid var(--border-strong);
    border-radius: 10px;
    background: var(--surface-2);
    color: var(--text);
    width: 100%;
    outline-offset: 1px;
    -webkit-appearance: none;
    appearance: none;
    transition: border-color .12s ease, background .12s ease;
  }
  .campo-filtro input:hover,
  .campo-filtro select:hover { border-color: var(--text-3); }
  .campo-filtro input:focus,
  .campo-filtro select:focus {
    border-color: var(--accent);
    background: var(--surface);
    outline: 3px solid var(--accent-soft);
  }

  button#btn-reset {
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 9px 18px;
    border: 1.5px solid transparent;
    border-radius: 10px;
    background: var(--accent-soft);
    color: var(--accent-dark);
    cursor: pointer;
    height: 40px;
    flex: 0 0 auto;
    transition: background .12s ease;
  }
  button#btn-reset:hover { background: #dbe6ca; }

  .pillola-conteggio {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-2);
    white-space: nowrap;
    margin-left: auto;
    padding-bottom: 10px;
  }
  .pillola-conteggio strong {
    color: var(--accent-dark);
    font-weight: 800;
  }

  main {
    flex: 1;
    padding: 20px 24px 32px;
  }

  /* --- Tabella (desktop) --- */
  .tabella-scroll {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    overflow: visible;
    border: 1px solid var(--border);
  }

  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 13.5px;
  }

  thead th {
    position: sticky;
    top: var(--altezza-fissa, 0px);
    background: var(--surface-2);
    text-align: left;
    padding: 13px 16px;
    border-bottom: 1.5px solid var(--border-strong);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
    font-weight: 700;
    color: var(--text-2);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .05em;
    transition: color .12s ease;
  }
  thead th:hover { color: var(--accent); }
  thead th.col-numero { cursor: default; text-align: right; }
  thead th.col-numero:hover { color: var(--text-2); }
  thead th:first-child { border-top-left-radius: var(--radius); }
  thead th:last-child { border-top-right-radius: var(--radius); }
  tbody tr:last-child td:first-child { border-bottom-left-radius: var(--radius); }
  tbody tr:last-child td:last-child { border-bottom-right-radius: var(--radius); }

  .icona-ordinamento {
    display: inline-block;
    margin-left: 4px;
    font-size: 10px;
    color: var(--accent);
  }

  tbody td {
    padding: 13px 16px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr { transition: background .1s ease; }
  tbody tr:hover { background: var(--accent-soft); }

  .col-titolo { min-width: 240px; font-weight: 600; }
  .col-descrizione { min-width: 280px; color: var(--text-2); font-weight: 400; }
  .col-numero { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--accent-dark); white-space: nowrap; }
  .col-numero-progressivo {
    text-align: right;
    color: var(--text-3);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    width: 1%;
    white-space: nowrap;
  }

  .badge-tipo {
    display: inline-block;
    font-size: 11.5px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent-dark);
    white-space: nowrap;
  }

  .badge-quarantena {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    color: #92400e;
    background: #fef3c7;
    border-radius: 999px;
    padding: 2px 9px;
    margin-right: 6px;
  }
  a.link-fonte {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: var(--accent);
    font-weight: 700;
    text-decoration: none;
  }
  a.link-fonte:hover { color: var(--accent-dark); text-decoration: underline; }

  .nessun-risultato {
    padding: 56px 20px;
    text-align: center;
    color: var(--text-3);
    font-size: 14.5px;
    font-weight: 500;
  }

  /* --- Card (mobile) --- */
  .elenco-card {
    display: none;
  }

  .scheda-evento {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    border: 1px solid var(--border);
    padding: 16px 18px;
    margin-bottom: 12px;
    transition: box-shadow .15s ease, transform .15s ease;
  }
  .scheda-evento:active { transform: scale(.99); }

  .scheda-evento .riga-alto {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 8px;
  }
  .scheda-evento .numero-progressivo {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-3);
    padding-top: 2px;
    flex-shrink: 0;
  }
  .scheda-evento .titolo-evento {
    font-weight: 700;
    font-size: 15px;
    line-height: 1.35;
    letter-spacing: -.01em;
    flex: 1;
  }
  .scheda-evento .km-evento {
    font-size: 12px;
    font-weight: 800;
    color: #fff;
    background: var(--accent);
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .scheda-evento .riga-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-2);
    margin-bottom: 10px;
  }
  .scheda-evento .riga-meta .puntino {
    color: var(--text-3);
  }
  .scheda-evento .descrizione-evento {
    font-size: 13.5px;
    color: var(--text-2);
    line-height: 1.5;
    margin-bottom: 10px;
  }
  .scheda-evento .riga-basso {
    display: flex;
    justify-content: flex-end;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }

  @media (max-width: 760px) {
    header { padding: 12px 16px; }
    .sottotitolo { display: none; }
    .barra-filtri { padding: 12px 16px; gap: 10px; }
    main { padding: 16px 16px 28px; }
    .campo-filtro { flex: 1 1 45%; }
    button#btn-reset { flex: 1 1 100%; order: 5; }
    .pillola-conteggio { flex: 1 1 100%; margin-left: 0; justify-content: flex-start; order: 4; padding-bottom: 2px; }

    .tabella-scroll { display: none; }
    .elenco-card { display: block; }
  }
</style>
</head>
<body>

<header>
  <div class="titolo-pagina">
    <span class="logo-punto"></span>
    <h1>Eventi Langhe</h1>
    <span class="sottotitolo" id="aggiornato"></span>
  </div>
  <div class="header-destra">
    <a href="index.html" class="link-mappa">← Mappa</a>
    <a href="perimetro.html" class="link-mappa">Perimetro comuni</a>
  </div>
</header>

<div class="barra-filtri">
  <div class="campo-filtro">
    <label for="filtro-data">Data</label>
    <input type="date" id="filtro-data">
  </div>
  <div class="campo-filtro">
    <label for="filtro-comune">Comune</label>
    <select id="filtro-comune">
      <option value="">Tutti</option>
    </select>
  </div>
  <div class="campo-filtro">
    <label for="filtro-tipologia">Tipo evento</label>
    <select id="filtro-tipologia">
      <option value="">Tutti</option>
    </select>
  </div>
  <button type="button" id="btn-reset">Azzera filtri</button>
  <span class="pillola-conteggio" id="stato">Caricamento…</span>
</div>

<main>
  <div class="tabella-scroll">
    <table id="tabella-eventi">
      <thead>
        <tr>
          <th class="col-numero-progressivo">#</th>
          <th data-colonna="titolo">Titolo<span class="icona-ordinamento"></span></th>
          <th data-colonna="tipologia">Tipo<span class="icona-ordinamento"></span></th>
          <th data-colonna="comune">Comune<span class="icona-ordinamento"></span></th>
          <th data-colonna="data_inizio">Dal<span class="icona-ordinamento"></span></th>
          <th data-colonna="data_fine">Al<span class="icona-ordinamento"></span></th>
          <th data-colonna="km" class="col-numero">Km<span class="icona-ordinamento"></span></th>
          <th class="col-descrizione">Descrizione</th>
          <th>Fonte</th>
        </tr>
      </thead>
      <tbody id="corpo-tabella"></tbody>
    </table>
  </div>

  <div class="elenco-card" id="elenco-card"></div>
</main>

<script>
const URL_DATI_REMOTI = "eventi_mappa.json";

let eventiTotali = [];
let colonnaOrdinamento = "km";
let direzioneOrdinamento = 1;

const NOMI_MESI = ["gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno",
  "luglio", "agosto", "settembre", "ottobre", "novembre", "dicembre"];

function formattaDataOraItaliana(isoDataOra) {
  if (!isoDataOra) return "?";
  const [parteData, parteOra] = isoDataOra.split("T");
  if (!parteData) return isoDataOra;
  const [anno, mese, giorno] = parteData.split("-");
  const testoData = `${giorno} ${NOMI_MESI[Number(mese) - 1]} ${anno}`;
  if (!parteOra) return testoData;
  const [ore, minuti] = parteOra.split(":");
  return `${testoData} alle ${ore}:${minuti}`;
}

function formattaDataItalianaBreve(iso) {
  if (!iso) return "";
  const [anno, mese, giorno] = iso.split("-");
  return `${giorno}/${mese}/${anno}`;
}

function dataOdiernaIso() {
  const oggi = new Date();
  const anno = oggi.getFullYear();
  const mese = String(oggi.getMonth() + 1).padStart(2, "0");
  const giorno = String(oggi.getDate()).padStart(2, "0");
  return `${anno}-${mese}-${giorno}`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function impostaStato(testo, errore) {
  const el = document.getElementById("stato");
  el.textContent = testo;
  el.style.color = errore ? "#a24a3d" : "";
}

async function caricaEventi() {
  try {
    const risposta = await fetch(URL_DATI_REMOTI, { cache: "no-store" });
    if (!risposta.ok) throw new Error("HTTP " + risposta.status);
    const dati = await risposta.json();
    eventiTotali = Array.isArray(dati.eventi) ? dati.eventi : [];
    popolaFiltri();
    applicaFiltri();
    document.getElementById("aggiornato").textContent = `Aggiornato il ${formattaDataOraItaliana(dati.generato_il)}`;
  } catch (e) {
    impostaStato("Caricamento non riuscito: " + e.message, true);
  }
}

function popolaFiltri() {
  const comuni = [...new Set(eventiTotali.map((ev) => ev.comune).filter(Boolean))].sort((a, b) => a.localeCompare(b, "it"));
  const tipologie = [...new Set(eventiTotali.map((ev) => ev.tipologia).filter(Boolean))].sort((a, b) => a.localeCompare(b, "it"));

  const selComune = document.getElementById("filtro-comune");
  for (const comune of comuni) {
    const opt = document.createElement("option");
    opt.value = comune;
    opt.textContent = comune;
    selComune.appendChild(opt);
  }

  const selTipologia = document.getElementById("filtro-tipologia");
  for (const tipo of tipologie) {
    const opt = document.createElement("option");
    opt.value = tipo;
    opt.textContent = tipo;
    selTipologia.appendChild(opt);
  }
}

function eventiFiltrati() {
  const data = document.getElementById("filtro-data").value;
  const comune = document.getElementById("filtro-comune").value;
  const tipologia = document.getElementById("filtro-tipologia").value;

  return eventiTotali.filter((ev) => {
    if (data) {
      const fineEvento = ev.data_fine || ev.data_inizio;
      if (!(ev.data_inizio <= data && data <= fineEvento)) return false;
    }
    if (comune && ev.comune !== comune) return false;
    if (tipologia && ev.tipologia !== tipologia) return false;
    return true;
  });
}

function ordina(eventi) {
  const col = colonnaOrdinamento;
  return [...eventi].sort((a, b) => {
    const va = a[col] ?? "";
    const vb = b[col] ?? "";
    if (va < vb) return -1 * direzioneOrdinamento;
    if (va > vb) return 1 * direzioneOrdinamento;
    return 0;
  });
}

function aggiornaIndicatoriOrdinamento() {
  document.querySelectorAll("thead th[data-colonna]").forEach((th) => {
    const icona = th.querySelector(".icona-ordinamento");
    if (th.dataset.colonna === colonnaOrdinamento) {
      icona.textContent = direzioneOrdinamento === 1 ? "▲" : "▼";
    } else {
      icona.textContent = "";
    }
  });
}

function applicaFiltri() {
  aggiornaIndicatoriOrdinamento();
  const filtrati = ordina(eventiFiltrati());
  disegnaTabella(filtrati);
  disegnaCard(filtrati);
  aggiornaConteggio(filtrati.length);
}

function disegnaTabella(filtrati) {
  const corpo = document.getElementById("corpo-tabella");
  corpo.innerHTML = "";

  if (filtrati.length === 0) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td colspan="9" class="nessun-risultato">Nessun evento corrisponde ai filtri selezionati.</td>`;
    corpo.appendChild(tr);
    return;
  }

  filtrati.forEach((ev, indice) => {
    const tr = document.createElement("tr");
    const linkFonte = ev.url
      ? `<a class="link-fonte" href="${escapeHtml(ev.url)}" target="_blank" rel="noopener">apri</a>`
      : "";
    tr.innerHTML = `
      <td class="col-numero-progressivo">${indice + 1}</td>
      <td class="col-titolo">${ev.quarantena ? '<span class="badge-quarantena">⚠️ da verificare</span>' : ""}${escapeHtml(ev.titolo || "")}</td>
      <td><span class="badge-tipo">${escapeHtml(ev.tipologia || "")}</span></td>
      <td>${escapeHtml(ev.comune || "")}</td>
      <td>${formattaDataItalianaBreve(ev.data_inizio)}</td>
      <td>${formattaDataItalianaBreve(ev.data_fine)}</td>
      <td class="col-numero">${ev.km != null ? ev.km : ""}</td>
      <td class="col-descrizione">${escapeHtml(ev.descrizione || "")}</td>
      <td>${linkFonte}</td>
    `;
    corpo.appendChild(tr);
  });
}

function disegnaCard(filtrati) {
  const contenitore = document.getElementById("elenco-card");
  contenitore.innerHTML = "";

  if (filtrati.length === 0) {
    contenitore.innerHTML = `<div class="nessun-risultato">Nessun evento corrisponde ai filtri selezionati.</div>`;
    return;
  }

  filtrati.forEach((ev, indice) => {
    const periodo = ev.data_fine && ev.data_fine !== ev.data_inizio
      ? `${formattaDataItalianaBreve(ev.data_inizio)} → ${formattaDataItalianaBreve(ev.data_fine)}`
      : formattaDataItalianaBreve(ev.data_inizio);
    const linkFonte = ev.url
      ? `<a class="link-fonte" href="${escapeHtml(ev.url)}" target="_blank" rel="noopener">apri fonte →</a>`
      : "";
    const scheda = document.createElement("div");
    scheda.className = "scheda-evento";
    scheda.innerHTML = `
      <div class="riga-alto">
        <span class="numero-progressivo">${indice + 1}</span>
        <div class="titolo-evento">${ev.quarantena ? '<span class="badge-quarantena">⚠️</span>' : ""}${escapeHtml(ev.titolo || "")}</div>
        ${ev.km != null ? `<div class="km-evento">${ev.km} km</div>` : ""}
      </div>
      <div class="riga-meta">
        <span class="badge-tipo">${escapeHtml(ev.tipologia || "")}</span>
        <span class="puntino">·</span>
        <span>${escapeHtml(ev.comune || "")}</span>
        <span class="puntino">·</span>
        <span>${escapeHtml(periodo)}</span>
      </div>
      ${ev.descrizione ? `<div class="descrizione-evento">${escapeHtml(ev.descrizione)}</div>` : ""}
      ${linkFonte ? `<div class="riga-basso">${linkFonte}</div>` : ""}
    `;
    contenitore.appendChild(scheda);
  });
}

function aggiornaConteggio(n) {
  const totale = eventiTotali.length;
  const el = document.getElementById("stato");
  if (n === totale) {
    el.innerHTML = `<strong>${totale}</strong> eventi`;
  } else {
    el.innerHTML = `<strong>${n}</strong> su ${totale} eventi`;
  }
  el.style.color = "";
}

document.getElementById("filtro-data").addEventListener("change", applicaFiltri);
document.getElementById("filtro-comune").addEventListener("change", applicaFiltri);
document.getElementById("filtro-tipologia").addEventListener("change", applicaFiltri);

document.getElementById("btn-reset").addEventListener("click", () => {
  document.getElementById("filtro-data").value = "";
  document.getElementById("filtro-comune").value = "";
  document.getElementById("filtro-tipologia").value = "";
  applicaFiltri();
});

document.querySelectorAll("thead th[data-colonna]").forEach((th) => {
  th.addEventListener("click", () => {
    const col = th.dataset.colonna;
    if (colonnaOrdinamento === col) {
      direzioneOrdinamento *= -1;
    } else {
      colonnaOrdinamento = col;
      direzioneOrdinamento = 1;
    }
    applicaFiltri();
  });
});

function aggiornaAltezzaFissa() {
  const header = document.querySelector("header");
  const filtri = document.querySelector(".barra-filtri");
  document.documentElement.style.setProperty("--altezza-header", `${header.offsetHeight}px`);
  document.documentElement.style.setProperty("--altezza-fissa", `${header.offsetHeight + filtri.offsetHeight}px`);
}

window.addEventListener("resize", aggiornaAltezzaFissa);
aggiornaAltezzaFissa();

document.getElementById("filtro-data").value = dataOdiernaIso();
caricaEventi();
</script>
